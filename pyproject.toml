[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hcmus-flpa-clustering"
version = "0.1.0"
requires-python = ">=3.9"
description = "Independent FLPA implementation for the HCMUS clustering project"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
